<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; background: #d0d5dc; display: flex; justify-content: center; align-items: center; height: 100vh; }
  .box { width: 480px; height: 860px; background: #e2e8f0; position: relative; overflow: hidden; }
  svg { position: absolute; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="box">
  <svg viewBox="0 0 480 860" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path
      d="M 240,-50
         C 400,200 150,600 -50,750
         C -150,850 50,850 150,700
         C 250,550 400,450 450,550
         C 500,650 350,650 350,550
         C 350,450 450,450 500,550"
      stroke="#daff47"
      stroke-width="28"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </svg>
</div>
</body>
</html>
